<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAP CRM Test Rehberi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: modern kurumsal ürün; sakin, net, güven veren
   IDEA: test yöneticisinin kontrol paneli — her cevap bir şema, bir örnek, bir kontrol listesi
   PICTURE: süreç akış şemaları, aşama zaman çizelgesi, SLA çubuğu, entegrasyon mimarisi
   COLOUR and TYPE: beyaz zemin, mürekkep #0b0d12, elektrik mavisi #0057ff, durum renkleri; Inter Tight + Inter
   LAYOUT: masaüstünde sol gezinme + orta sohbet; telefonda çekmece menü, alt sabit giriş */
:root{color-scheme:light dark;--bg:light-dark(#f6f7fb,#0b0d12);--card:light-dark(#fff,#141821);--ink:light-dark(#0b0d12,#eef0f5);--mut:light-dark(#5d6474,#98a0b3);--line:light-dark(#e4e7ef,#252b38);--soft:light-dark(#eef2fb,#1b2130);--acc:#0057ff;--accs:light-dark(#e6eeff,#14244a);--ok:light-dark(#0f8a4b,#3ccf86);--bad:light-dark(#d1243a,#ff6b7d);--warn:light-dark(#b25e00,#ffb35c);--vio:light-dark(#6a3fd1,#a88bff);--sh:0 1px 2px rgba(10,20,40,.05),0 8px 24px rgba(10,20,40,.06)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'Inter Tight',Inter,sans-serif;letter-spacing:-.015em;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside{position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-right:1px solid var(--line);padding:20px 14px 30px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--acc);display:grid;place-items:center;flex:0 0 auto}
.brand b{font:800 17px/1.1 'Inter Tight',sans-serif;display:block}.brand small{color:var(--mut);font-size:13px}
.nav h4{font-size:13px;color:var(--mut);font-weight:600;margin:18px 8px 6px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;font-size:14px;font-weight:500;min-height:40px}
.nav button:hover{background:var(--soft)}
.nav .dot{width:8px;height:8px;border-radius:50%;background:var(--line);flex:0 0 auto}
.nav button:hover .dot{background:var(--acc)}
.cta{width:100%;min-height:46px;border:0;border-radius:12px;background:var(--acc);color:#fff !important;font-weight:700;margin-top:4px}
.top{display:none}
.wrap{display:flex;flex-direction:column;min-height:100vh}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:24px clamp(14px,3vw,32px) 150px}
.m{margin:18px 0;display:flex}
.m.u{justify-content:flex-end}
.m.u .bub{background:var(--ink);color:var(--bg);border-radius:18px 18px 4px 18px;padding:10px 16px;font-weight:600;max-width:80%}
.m.k .bub{width:100%;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:clamp(16px,2.6vw,26px);box-shadow:var(--sh)}
.lbl{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--acc);background:var(--accs);border-radius:99px;padding:3px 10px;margin-bottom:10px}
.bub h2{font-size:clamp(22px,3vw,30px);line-height:1.1;margin-bottom:8px;text-wrap:balance}
.bub h3{font-size:17px;margin:22px 0 10px}
.bub p{margin:6px 0;max-width:70ch;color:var(--ink)}
.lead{color:var(--mut)!important}
.bub ul,.bub ol{margin:6px 0;padding-left:22px}.bub li{margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 2px}
.chip{min-height:40px;padding:7px 14px;border:1px solid var(--line);background:var(--card);border-radius:99px;font-size:14px;font-weight:600;text-align:left}
.chip:hover{border-color:var(--acc);color:var(--acc)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.p{background:var(--acc);color:#fff;border-color:var(--acc)}
/* flow diagram */
.fig{background:var(--soft);border-radius:16px;padding:18px;margin:14px 0}
.fig .cap{font-size:13px;color:var(--mut);margin:10px 0 0}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0}
.node{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 13px;font-size:14px;font-weight:600;box-shadow:var(--sh);position:relative}
.node small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.node.s{border-color:var(--acc);background:var(--accs)}
.node.e{border-color:var(--ok)}
.arr{width:28px;height:2px;background:var(--mut);position:relative;margin:0 4px;opacity:.6}
.arr::after{content:'';position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--mut);border-right:0}
.branch{display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;color:var(--mut)}
.node.x{border-color:var(--bad);color:var(--bad)}
/* phase timeline */
.tl{display:flex;overflow-x:auto;gap:0;padding:6px 2px 4px;scrollbar-width:thin}
.ph{flex:0 0 auto;width:112px;text-align:center;position:relative;padding-top:26px;font-size:12.5px;font-weight:600;background:none;border:0;line-height:1.25}
.ph::before{content:'';position:absolute;top:9px;left:0;right:0;height:3px;background:var(--line)}
.ph::after{content:attr(data-n);position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--line);font-size:11px;display:grid;place-items:center;color:var(--mut)}
.ph.on::after{background:var(--acc);border-color:var(--acc);color:#fff}.ph.on{color:var(--acc)}
.ph:hover{color:var(--acc)}
/* v model */
.vm{display:grid;grid-template-columns:minmax(0,1fr) 70px minmax(0,1fr);gap:8px 0;align-items:center}
.vm .node{text-align:center}
.vm .ln{height:2px;border-top:2px dashed var(--mut);opacity:.5}
.vm .bot{grid-column:1/4;justify-self:center}
/* arch */
.arch{display:grid;grid-template-columns:minmax(0,1fr) 90px minmax(0,1fr) 90px minmax(0,1fr);align-items:center}
.box{background:var(--card);border-radius:14px;border:1.5px solid var(--line);padding:14px;box-shadow:var(--sh)}
.box b{display:block;font-family:'Inter Tight',Inter,sans-serif;font-size:16px}.box span{font-size:12.5px;color:var(--mut);display:block;margin-top:4px}
.box.c{border-color:var(--acc)}
.link{text-align:center;font-size:11.5px;color:var(--mut);line-height:1.2}
.link i{display:block;height:2px;background:var(--acc);margin:6px 4px;position:relative;opacity:.7}
.link i::before,.link i::after{content:'';position:absolute;top:-4px;border:5px solid transparent}
.link i::after{right:-2px;border-left:7px solid var(--acc);border-right:0}.link i::before{left:-2px;border-right:7px solid var(--acc);border-left:0}
/* sla */
.sla{display:flex;height:38px;border-radius:10px;overflow:hidden;font-size:12px;font-weight:600;color:#fff}
.sla div{display:grid;place-items:center;padding:0 4px;text-align:center;line-height:1.1}
.sla .pause{background:repeating-linear-gradient(45deg,#8a93a6 0 6px,#7a8396 6px 12px)}
.slaax{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:6px;position:relative}
.dl{position:absolute;top:-50px;height:46px;border-left:2px dashed var(--bad)}
/* scenario cards */
.scs{display:grid;gap:10px}
details.sc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.sc[open]{box-shadow:var(--sh);border-color:light-dark(#cdd5e6,#33405a)}
.sc summary{list-style:none;display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;min-height:52px}
.sc summary::-webkit-details-marker{display:none}
.sc summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);margin-left:auto;flex:0 0 auto;transition:transform .2s}
.sc[open] summary::after{transform:rotate(-135deg)}
.sid{font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--mut);white-space:nowrap}
.st{font-weight:600;font-size:15px}
.tg{font-size:12px;font-weight:700;border-radius:99px;padding:3px 9px;white-space:nowrap;flex:0 0 auto}
.tP{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}.tN{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}.tS{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}.tY{color:var(--vio);background:color-mix(in srgb,var(--vio) 14%,transparent)}.tE{color:var(--acc);background:var(--accs)}.tF{color:var(--mut);background:var(--soft)}
.scb{padding:2px 16px 16px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.steps{list-style:none;padding:0!important;margin:0!important;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 34px;font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--accs);color:var(--acc);font-size:12px;font-weight:700;display:grid;place-items:center}
.steps li:not(:last-child)::after{content:'';position:absolute;left:10.5px;top:24px;bottom:2px;width:1px;background:var(--line)}
.exp{background:color-mix(in srgb,var(--ok) 9%,transparent);border-left:3px solid var(--ok);border-radius:8px;padding:10px 12px;font-size:14px;align-self:start}
.exp b{display:block;font-size:12.5px;color:var(--ok);margin-bottom:2px}
/* example card */
.ex{border:1.5px dashed var(--acc);border-radius:16px;padding:16px;background:light-dark(#fbfcff,#111727)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:14px}
.kv dt{color:var(--mut);font-weight:600}.kv dd{margin:0}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--mut)}
.note{font-size:12.5px;color:var(--mut);margin-top:8px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0}
.stat{background:var(--soft);border-radius:14px;padding:14px}
.stat b{display:block;font:800 clamp(26px,4vw,38px)/1 'Inter Tight',Inter,sans-serif;color:var(--acc)}.stat span{font-size:13px;color:var(--mut)}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:100px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--soft);border-radius:99px;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:99px}
.bar .n{text-align:right;font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sev{border-radius:14px;padding:14px;background:var(--soft);border-top:4px solid}
.sev b{display:block;font-family:'Inter Tight',Inter,sans-serif;margin-bottom:4px}.sev span{font-size:13px;color:var(--mut)}
.chk{list-style:none;padding:0!important}.chk li{padding-left:28px;position:relative}
.chk li::before{content:'';position:absolute;left:2px;top:3px;width:16px;height:16px;border-radius:5px;border:2px solid var(--acc)}
.qs{counter-reset:q;list-style:none;padding:0!important;display:grid;gap:8px}
.qs li{counter-increment:q;background:var(--soft);border-radius:12px;padding:10px 12px 10px 44px;position:relative;font-size:14.5px;margin:0!important}
.qs li::before{content:'S' counter(q);position:absolute;left:12px;top:10px;font-weight:800;color:var(--acc);font-size:13px}
.tip{background:var(--accs);border-radius:12px;padding:12px 14px;font-size:14px;margin:14px 0}
.tip b{color:var(--acc)}
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.mc{background:var(--soft);border:1px solid transparent;border-radius:14px;padding:12px 14px;text-align:left;min-height:64px}
.mc:hover{border-color:var(--acc)}
.mc b{display:block;font-size:14.5px}.mc span{font-size:12.5px;color:var(--mut)}
textarea{width:100%;height:160px;font:13px/1.4 ui-monospace,monospace;background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}
form{position:fixed;left:290px;right:0;bottom:0;padding:12px clamp(14px,3vw,32px) calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.f{max-width:936px;margin:0 auto;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--sh)}
input{flex:1;min-height:46px;font:16px Inter,sans-serif;padding:0 12px;border:0;background:none;color:var(--ink);outline:none}
.send{border:0;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;padding:0 18px;min-height:46px}
.scrim{display:none}
@media(max-width:900px){
.app{grid-template-columns:minmax(0,1fr)}
aside{position:fixed;inset:0 auto 0 0;width:300px;max-width:86vw;z-index:20;transform:translateX(-102%);transition:transform .25s}
aside.open{transform:none}
.scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
.top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:10px 14px}
.top b{font:800 16px 'Inter Tight',Inter,sans-serif}
.mb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
form{left:0}}
@media(max-width:640px){.scb{grid-template-columns:minmax(0,1fr)}.stats,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{grid-template-columns:minmax(0,1fr)}.kv dt{margin-top:6px}
.arch{grid-template-columns:minmax(0,1fr)}.link{padding:4px 0}.link i{width:2px;height:22px;margin:4px auto}.link i::after{right:-4px;top:auto;bottom:-3px;border:5px solid transparent;border-top:7px solid var(--acc);border-bottom:0}.link i::before{left:-4px;top:-3px;border:5px solid transparent;border-bottom:7px solid var(--acc);border-top:0}
.vm{grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr)}.vm .node{font-size:12.5px;padding:8px}
.flow .arr{width:16px}.sc summary{flex-wrap:wrap}.bar{grid-template-columns:84px minmax(0,1fr) 30px}}
@media(prefers-reduced-motion:no-preference){.m{animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(8px)}}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
<div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div><div><b>SAP CRM Test Rehberi</b><small>Kural tabanlı · veri göndermez</small></div></div>
<button class="cta" type="button" data-q="plan oluştur">Test planı oluştur</button>
<div class="nav" id="nav"></div>
</aside>
<div class="scrim" id="scrim"></div>
<div class="wrap">
<div class="top"><button class="mb" id="mb" type="button" aria-label="Menü"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><b>SAP CRM Test Rehberi</b></div>
<main id="chat" aria-live="polite"></main>
</div>
</div>
<form id="f"><div class="f"><input id="q" autocomplete="off" placeholder="Örn: teklif için negatif senaryolar" aria-label="Soru yaz"><button class="send" type="submit">Sor</button></div></form>
<script>
{
const T={P:'Pozitif',N:'Negatif',S:'Sınır',Y:'Yetki',E:'Entegrasyon',F:'Performans'};
const s=(t,y,a,e)=>({t,y,a,e});
const M=[
{id:'BP',n:'İş ortağı, hesap ve kontak',ent:'hesap',kw:['is ortagi','hesap','kontak','musteri','account','contact','business partner','muhatap','adres','bp'],
q:['Kurumsal ve bireysel müşteri ayrımı var mı, hangi BP rolleri kullanılacak?','Mükerrer kayıt kontrolü hangi alanlara göre yapılacak (ünvan, vergi no, telefon)?','Numara aralığını CRM mi ERP mi belirliyor?','Grup şirketleri için hesap hiyerarşisi gerekiyor mu?','KVKK iletişim izinleri hangi alanda, nasıl tutulacak?'],
sc:[s('Yeni kurumsal hesap oluştur','P','Hesap ekranını aç → zorunlu alanları, adres ve iletişim bilgilerini gir → kaydet','Hesap numarası atanır, kayıt aramada bulunur'),
s('Kontak oluştur ve hesaba bağla','P','Kontak oluştur → hesap ilişkisi ekle → departman ve görev gir','İlişki hem hesapta hem kontakta görünür'),
s('Mükerrer hesap kontrolü','N','Var olan ünvan ve vergi no ile yeni hesap açmayı dene','Uyarı verilir, olası eşleşmeler listelenir'),
s('Vergi no boş veya hatalı','N','Vergi no alanını boş bırak / harf gir → kaydet','Hata mesajı çıkar, kayıt oluşmaz'),
s('Vergi no / TCKN uzunluk sınırı','S','9, 10, 11 ve 12 haneli değer dene','Yalnızca geçerli uzunluk ve kontrol hanesi kabul edilir'),
s('Türkçe ve özel karakterler','S','Ünvana “Çağlar Şişli Gıda Ltd. Şti. & Ortakları” yaz → kaydet → ara','Karakterler bozulmadan kaydedilir, aramada bulunur'),
s('Hesap hiyerarşisi','P','Ana hesap altına iki alt hesap bağla','Ağaç doğru görünür, raporlarda toplamlar ana hesaba yuvarlanır'),
s('Hesabın ERP/S4 tarafına aktarımı','E','Hesabı kaydet → ERP’de müşteri kaydını kontrol et','Aynı numara ve verilerle oluşur, kuyrukta hata yok'),
s('Hesabı bloke et','P','Hesaba satış blokesi koy → yeni sipariş açmayı dene','Sipariş engellenir, nedeni gösterilir'),
s('Başka bölgenin hesabını düzenleme','Y','Bölge A temsilcisi ile Bölge B hesabını aç → düzenle','Erişim reddedilir veya salt okunur açılır'),
s('İletişim izni olmayan kontak','P','İletişim iznini “Hayır” yap → kampanya hedef grubuna eklemeyi dene','Kontak hedef gruptan dışlanır')]},
{id:'ACT',n:'Aktivite yönetimi',ent:'aktivite',kw:['aktivite','randevu','gorev','activity','takvim','ziyaret','arama kaydi','outlook','groupware'],
q:['Randevular Outlook/Exchange ile senkronize edilecek mi?','Aktivite türleri ve zorunlu alanları neler (ziyaret, telefon, e-posta)?','Geçmiş tarihli aktivite girilebilecek mi?','Özel (private) aktivite gereksinimi var mı?'],
sc:[s('Müşteri ziyareti randevusu oluştur','P','Hesaptan randevu aç → tarih, katılımcı, konu gir → kaydet','Takvimde ve hesap geçmişinde görünür'),
s('Outlook senkronizasyonu','E','CRM’de randevu oluştur → Outlook’u kontrol et → Outlook’ta saati değiştir','İki yönlü güncellenir, çift kayıt oluşmaz'),
s('Başkasına görev atama','P','Görev oluştur → sorumlu olarak başka kullanıcıyı seç','Atanan kişinin listesine düşer, bildirim gider'),
s('Bitiş tarihi başlangıçtan önce','N','Bitişi başlangıçtan önceye ayarla → kaydet','Hata mesajı, kayıt oluşmaz'),
s('Tamamlanan aktiviteyi yeniden açma','N','Durumu “Tamamlandı” yap → tekrar “Açık” yapmayı dene','Kurala göre engellenir veya yetkili kullanıcıya açıktır'),
s('Tekrarlayan randevu','S','Her hafta, 52 tekrar oluştur → tek tekrarı sil','Seri doğru oluşur, tekil silme seriyi bozmaz'),
s('Özel aktivite gizliliği','Y','A kullanıcısı özel aktivite girer → B kullanıcısı aynı hesabı açar','B konu ve detayları göremez')]},

${sug.length?'<h3>Bu aşamada öne çıkan modüller</h3>'+chips(sug.map(id=>{const m=M.find(x=>x.id===id);return[m.n,m.n]})):''}`);
}
const e2e=(f,i)=>`<div class="fig"><p style="margin:0 0 10px;font-weight:700">E2E-${String(i+1).padStart(2,'0')} · ${esc(f.n)}</p><div class="flow">${f.a.map((x,j)=>`${j?'<span class="arr"></span>':''}<div class="node${j==0?' s':''}${j==f.a.length-1?' e':''}" style="max-width:200px"><small>Adım ${j+1}</small>${esc(x)}</div>`).join('')}</div></div>`;
function showFlows(){say(`${lbl('Uçtan uca')}<h2>Uçtan uca süreç testleri</h2><p class="lead">Her akış tek bir test olarak koşulur; bir adımın çıktısı bir sonrakinin girdisidir.</p>${FL.map(e2e).join('')}<div class="tip"><b>Öneri.</b> Her akışı üç veri setiyle koşun: standart müşteri, istisnai müşteri (bloke, kredi limiti dolu) ve yabancı para birimli müşteri.</div>`)}
const INFO={
hata:()=>`${lbl('Kalite')}<h2>Hata (defect) yönetimi</h2><h3>Önem dereceleri</h3><div class="grid4"><div class="sev" style="border-color:var(--bad)"><b>Kritik</b><span>Süreç durur, geçici çözüm yok. Örn: sipariş ERP’ye gitmiyor.</span></div><div class="sev" style="border-color:var(--warn)"><b>Yüksek</b><span>Süreç aksar, zor bir geçici çözüm var.</span></div><div class="sev" style="border-color:var(--acc)"><b>Orta</b><span>İşlev hatalı ama iş devam ediyor.</span></div><div class="sev" style="border-color:var(--mut)"><b>Düşük</b><span>Görsel veya metin hatası.</span></div></div>
<h3>Hata yaşam döngüsü</h3><div class="fig"><div class="flow"><div class="node s">Yeni</div><span class="arr"></span><div class="node">Atandı</div><span class="arr"></span><div class="node">Çözüldü</div><span class="arr"></span><div class="node">Yeniden test</div><span class="arr"></span><div class="node e">Kapandı</div></div><div class="branch">Yeniden test başarısız →<span class="node x">Tekrar atandı<small>Döngü baştan</small></span></div></div>
<h3>Örnek hata kaydı</h3><div class="ex"><dl class="kv"><dt>Hata no</dt><dd><b>DEF-0142</b></dd><dt>Senaryo</dt><dd>ORD-07 · Siparişin ERP/S4’e aktarımı, adım 2</dd><dt>Önem</dt><dd><span class="tg tN">Kritik</span></dd><dt>Ortam</dt><dd>QA · Rol: Satış temsilcisi</dd><dt>Beklenen</dt><dd>Sipariş ERP’de oluşur</dd><dt>Gerçekleşen</dt><dd>Mesaj kuyrukta hata ile bekliyor: “Ödeme koşulu eşlenemedi”</dd><dt>Ek</dt><dd>Ekran görüntüsü, belge no, kuyruk adı</dd></dl><p class="note">Örnek kayıttır.</p></div>`,
oto:()=>`${lbl('Otomasyon')}<h2>Test otomasyonu</h2><p class="lead">Regresyon seti, API testleri ve toplu veri doğrulamaları otomasyona en uygun alanlardır. Sık değişen ekranlar ve tek seferlik UAT senaryoları manuel kalmalıdır.</p><h3>Ne otomatikleşmeli?</h3>${bars([...Array(9)].map(()=>({y:'E'})).concat([...Array(7)].map(()=>({y:'P'})),[...Array(3)].map(()=>({y:'S'}))))}<p class="note">Yukarıdaki çubuklar örnek bir önceliklendirmedir: Entegrasyon (API) > Pozitif ana akışlar > Sınır kontrolleri.</p><h3>Yaygın araçlar</h3><ul class="chk"><li>SAP Cloud ALM / Solution Manager test yönetimi</li><li>Tricentis Tosca</li><li>CBTA ve eCATT (eski on-premise)</li><li>API testleri için Postman benzeri araçlar</li></ul><h3>Sorulacak sorular</h3>${qs(['Hangi senaryolar her sürümde tekrar koşulacak?','Test verisi her koşudan önce nasıl sıfırlanacak?','Scriptlerin bakımını kim yapacak?'])}`,
dok:()=>`${lbl('Dokümantasyon')}<h2>Test dokümanları</h2><div class="fig"><div class="flow"><div class="node s">Test stratejisi<small>Kapsam, roller, araçlar</small></div><span class="arr"></span><div class="node">Test planı<small>Takvim, kaynak</small></div><span class="arr"></span><div class="node">RTM<small>Gereksinim ↔ test</small></div><span class="arr"></span><div class="node">Senaryolar<small>Adım, veri, beklenen</small></div><span class="arr"></span><div class="node">Hata kayıtları</div><span class="arr"></span><div class="node e">Kapanış raporu<small>UAT onayı</small></div></div><p class="cap">Doküman zinciri: her doküman bir sonrakini besler.</p></div><div class="tip"><b>KVKK.</b> Gerçek müşteri verisi test ortamına alınacaksa maskeleme veya anonimleştirme yapılmalı.</div>`,
veri:()=>`${lbl('Test verisi')}<h2>Test verisi hazırlığı</h2><div class="grid4"><div class="sev" style="border-color:var(--acc)"><b>Müşteriler</b><span>Standart, bloke, kredi limiti dolu, yabancı</span></div><div class="sev" style="border-color:var(--ok)"><b>Ürünler</b><span>Stoklu, stoksuz, skalalı, farklı KDV</span></div><div class="sev" style="border-color:var(--vio)"><b>Kullanıcılar</b><span>Her rol için ayrı test kullanıcısı</span></div><div class="sev" style="border-color:var(--warn)"><b>Gizlilik</b><span>Gerçek veri kullanılırsa maskeleme zorunlu</span></div></div>`,
vm:()=>`${lbl('Metodoloji')}<h2>V-model ve test aşamaları</h2><p class="lead">SAP projelerinde testler tasarım adımlarına karşılık gelir. Önce tasarlanan, sonda test edilir.</p>${vmodel()}<h3>Proje zaman çizelgesi</h3>${tl()}`
};
function plan(){st={plat:null,mods:new Set(),phs:new Set()};say(`${lbl('Adım 1 / 3')}<h2>Hangi SAP platformu?</h2><p class="lead">Araçlar, kuyruk izleme ve yetki yapısı platforma göre değişir.</p>${chips(PLAT.map(p=>[p[1],'@plat '+p[0]]))}`)}
function wiz2(){say(`${lbl('Adım 2 / 3')}<h2>Kapsamdaki modüller</h2><p class="lead">Birden fazla seçebilirsiniz.</p><div class="chips">${M.map(m=>`<button type="button" class="chip" data-m="${m.id}" aria-pressed="false">${esc(m.n)}</button>`).join('')}</div><div class="chips"><button type="button" class="chip" data-all="m">Hepsini seç</button><button type="button" class="chip p" data-next="3">Devam</button></div>`)}
function wiz3(){say(`${lbl('Adım 3 / 3')}<h2>Planlanacak test aşamaları</h2><div class="chips">${PH.map(p=>`<button type="button" class="chip" data-p="${p.id}" aria-pressed="false">${esc(p.n)}</button>`).join('')}</div><div class="chips"><button type="button" class="chip" data-all="p">Hepsini seç</button><button type="button" class="chip p" data-next="4">Planı oluştur</button></div>`)}
function result(){
const ms=M.filter(m=>st.mods.has(m.id)),ps=PH.filter(p=>st.phs.has(p.id));
const rows=ms.flatMap(m=>rowsOf(m)),vr=ms.flatMap(m=>varsOf(m));lastRows=[...rows,...vr];
say(`${lbl('Test planı')}<h2>Test planınız hazır</h2><div class="stats"><div class="stat"><b>${lastRows.length}</b><span>senaryo</span></div><div class="stat"><b>${ms.length}</b><span>modül</span></div><div class="stat"><b>${ps.length}</b><span>aşama</span></div><div class="stat"><b>${FL.length}</b><span>uçtan uca akış</span></div></div>
<h3>Senaryo dağılımı</h3>${bars(lastRows)}${tip()}
<h3>Aşama sırası</h3><div class="fig"><div class="flow">${ps.map((p,i)=>`${i?'<span class="arr"></span>':''}<div class="node${i==0?' s':''}${i==ps.length-1?' e':''}"><small>${i+1}. aşama</small>${esc(p.n)}</div>`).join('')}</div></div>
${ms.map(m=>`<h3>${esc(m.n)}</h3>${m.id==='INT'?arch():flow(m.id)}${cards(rowsOf(m),0)}`).join('')}
<h3>Her modül için ek kontroller</h3>${cards(vr,0)}
<h3>Ekibe sorulacak sorular</h3>${ms.map(m=>`<p><b>${esc(m.n)}</b></p>${qs(m.q)}`).join('')}
${chips([['Tüm senaryoları Excel için kopyala','kopyala',1],['Uçtan uca akışlar','uçtan uca'],['Hata yönetimi','hata yönetimi']])}`);
}
function copy(){
if(!lastRows.length){say('<p>Kopyalanacak senaryo yok. Önce bir modül ya da plan açın.</p>');return}
const tsv=['Kod\tTür\tSenaryo\tAdımlar\tBeklenen sonuç\tDurum\tTest eden\tNot',...lastRows.map(r=>[r.id,T[r.y],r.t,r.a,r.e,'Koşulmadı','',''].join('\t'))].join('\n');
const fb=()=>say(`<p>Otomatik kopyalama engellendi. Metni seçip kopyalayın, Excel’e yapıştırın:</p><textarea readonly>${esc(tsv)}</textarea>`);
try{navigator.clipboard.writeText(tsv).then(()=>say(`${lbl('Kopyalandı')}<p><b>${lastRows.length} satır panoda.</b> Excel veya Google Sheets’e yapıştırın; durum, test eden ve not sütunları boş gelir.</p>`),fb)}catch(e){fb()}
}
function route(raw){
const q=nz(raw.trim());if(!q)return;closeNav();
if(q.startsWith('@plat ')){st.plat=q.slice(6);say(esc(PLAT.find(p=>p[0]===st.plat)[1]),'u');wiz2();return}
say(esc(raw),'u');
if(/^(basla|bastan|menu|ana sayfa|yardim|merhaba|selam)/.test(q)){home();return}
if(/plan|bastan sona|tum test/.test(q)){plan();return}
if(q.startsWith('varyant ')){const m=M.find(x=>x.id===raw.split(' ')[1]);if(m){showVar(m);return}}
if(/kopyala|excel|disa aktar/.test(q)&&!/rapor/.test(q)){copy();return}
if(/v-model|v model|metodoloji|asamalar neler|test asamalari/.test(q)){say(INFO.vm());return}
if(/uctan uca|e2e|end to end|lead to cash|lead-to-cash/.test(q)&&!/asama|kriter|test$/.test(q)){showFlows();return}
if(/hata yonetimi|defect|bug|hata kaydi|severity|onem derece/.test(q)){say(INFO.hata());return}
if(/otomasyon|automation|tosca|ecatt|cbta/.test(q)){say(INFO.oto());return}
if(/dokuman|strateji|rtm|izlenebilirlik|sablon/.test(q)){say(INFO.dok());return}
if(/test verisi|maskele/.test(q)){say(INFO.veri());return}
let f=null;for(const [k,v] of Object.entries(T))if(q.includes(nz(v)))f=k;
const sc=x=>x.kw.reduce((a,k)=>a+(new RegExp('(^|\\W)'+k.replace(/[/.*+?^${}()|[\]\\]/g,'\\$&')).test(q)?k.length:0),0)+(q.includes(nz(x.n))?50:0);
const bm=M.map(m=>[m,sc(m)]).sort((a,b)=>b[1]-a[1])[0],bp=PH.map(p=>[p,sc(p)]).sort((a,b)=>b[1]-a[1])[0];
if(f&&bm[1]>0&&bm[0].kw.some(k=>nz(T[f]).includes(k)))f=null;
if(bp[1]>bm[1]){showPh(bp[0]);return}
if(bm[1]>0){showMod(bm[0],f&&bm[0].sc.some(x=>x.y===f)?f:null);return}
if(f){const r=M.flatMap(m=>rowsOf(m,f));lastRows=r;say(`${lbl(T[f])}<h2>Tüm modüllerde ${T[f].toLowerCase()} senaryolar</h2><p class="lead">${r.length} senaryo.</p>${cards(r,1)}${chips([['Excel için kopyala','kopyala',1]])}`);return}
say(`<p>Bunu tam eşleştiremedim. Bir modül (hesap, fırsat, teklif, servis, kampanya, entegrasyon, yetki…), bir aşama (SIT, UAT, regresyon, cutover…) ya da “plan oluştur” yazmayı deneyin.</p>${chips([['Ana sayfa','başla'],['Test planı oluştur','plan oluştur',1],['Uçtan uca','uçtan uca']])}`);
}
const side=document.getElementById('side'),scrim=document.getElementById('scrim');
const closeNav=()=>{side.classList.remove('open');scrim.classList.remove('open')};
document.getElementById('mb').addEventListener('click',()=>{side.classList.add('open');scrim.classList.add('open')});
scrim.addEventListener('click',closeNav);
document.body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.q){route(b.dataset.q);return}
if(b.dataset.m||b.dataset.p){const set=b.dataset.m?st.mods:st.phs,k=b.dataset.m||b.dataset.p;set.has(k)?set.delete(k):set.add(k);b.classList.toggle('on');b.setAttribute('aria-pressed',b.classList.contains('on'));return}
if(b.dataset.all){const box=b.closest('.bub'),isM=b.dataset.all==='m';box.querySelectorAll(isM?'[data-m]':'[data-p]').forEach(x=>{(isM?st.mods:st.phs).add(x.dataset.m||x.dataset.p);x.classList.add('on')});return}
if(b.dataset.next==='3'){if(!st.mods.size){say('<p>En az bir modül seçin.</p>');return}say(st.mods.size+' modül seçildi','u');wiz3();return}
if(b.dataset.next==='4'){if(!st.phs.size){say('<p>En az bir aşama seçin.</p>');return}say(st.phs.size+' aşama seçildi','u');result();return}
});
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const i=document.getElementById('q');route(i.value);i.value=''});
home();
}
</script>
</body>
</html>
